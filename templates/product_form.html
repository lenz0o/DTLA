{% extends "base.html" %}
{% block title %}Product{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if product else 'Add' }} Product</h2>
<form method="post" class="card p-4" style="max-width:720px">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">SKU</label><input name="sku" class="form-control" required value="{{ product.sku if product else '' }}"></div>
    <div class="col-md-8"><label class="form-label">Name</label><input name="name" class="form-control" required value="{{ product.name if product else '' }}"></div>
    <div class="col-md-4">
      <label class="form-label">Category</label>
      <select name="category" class="form-select">
        {% for c in categories %}
        <option value="{{ c }}" {% if product and product.category == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Type</label><input name="product_type" class="form-control" value="{{ product.product_type if product else '' }}"></div>
    <div class="col-md-2"><label class="form-label">Unit Size</label><input type="number" step="any" name="unit_size" class="form-control" value="{{ product.unit_size if product else '' }}"></div>
    <div class="col-md-2"><label class="form-label">Unit</label><input name="unit" class="form-control" value="{{ product.unit if product else 'g' }}"></div>
    <div class="col-md-4"><label class="form-label">Supplier</label><input name="supplier" class="form-control" value="{{ product.supplier if product else '' }}"></div>
    <div class="col-md-2"><label class="form-label">Reorder</label><input type="number" step="any" name="reorder_level" class="form-control" value="{{ product.reorder_level if product else 0 }}"></div>
    <div class="col-md-3"><label class="form-label">Cost</label><input type="number" step="0.01" name="unit_cost" class="form-control" value="{{ product.unit_cost if product else 0 }}"></div>
    <div class="col-md-3"><label class="form-label">Retail</label><input type="number" step="0.01" name="retail_price" class="form-control" value="{{ product.retail_price if product else 0 }}"></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control">{{ product.notes if product else '' }}</textarea></div>
    <div class="col-12"><label><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}> Active</label></div>
  </div>
  <div class="mt-3">
    <button class="btn btn-success">Save</button>
    <a href="{{ url_for('products') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
