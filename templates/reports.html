{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<h2 class="mb-4">Inventory Reports</h2>
<p>Each download opens in Excel.</p>
<div class="row g-3">
  <div class="col-md-3">
    <div class="table-card p-4 text-center">
      <h5>Daily</h5>
      <a class="btn btn-success" href="/reports/download/daily">Download</a>
    </div>
  </div>
  <div class="col-md-3">
    <div class="table-card p-4 text-center">
      <h5>Weekly</h5>
      <a class="btn btn-success" href="/reports/download/weekly">Download</a>
    </div>
  </div>
  <div class="col-md-3">
    <div class="table-card p-4 text-center">
      <h5>Monthly</h5>
      <a class="btn btn-success" href="/reports/download/monthly">Download</a>
    </div>
  </div>
  <div class="col-md-3">
    <div class="table-card p-4 text-center">
      <h5>Yearly</h5>
      <a class="btn btn-success" href="/reports/download/yearly">Download</a>
    </div>
  </div>
</div>
{% endblock %}
