{% extends "base.html" %}
{% block title %}New Receipt{% endblock %}
{% block content %}
<h2 class="mb-4">Record Receiving</h2>
<form method="post" class="card p-4" style="max-width:720px">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required value="{{ today }}"></div>
    <div class="col-md-4"><label class="form-label">Receipt ID</label><input name="receipt_id" class="form-control" placeholder="Auto if blank"></div>
    <div class="col-md-4"><label class="form-label">Supplier</label><input name="supplier" class="form-control"></div>
    <div class="col-md-8">
      <label class="form-label">Product</label>
      <select name="product_id" class="form-select" required>
        <option value="">Select product…</option>
        {% for p in products %}
        <option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Batch / Lot</label><input name="batch_lot" class="form-control"></div>
    <div class="col-md-4">
      <label class="form-label">Location</label>
      <select name="location_id" class="form-select" required>
        {% for l in locations %}
        <option value="{{ l.id }}">{{ l.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Qty Received</label><input type="number" step="any" name="qty_received" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Unit Cost</label><input type="number" step="0.01" name="unit_cost" class="form-control" value="0"></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control"></textarea></div>
  </div>
  <div class="mt-3">
    <button class="btn btn-success">Save & Update Stock</button>
    <a href="{{ url_for('receiving_list') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
